name: Lint Backend

on:
  push:

concurrency:
  group: lint-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore pablo/pablo.slnx

      - name: Build
        run: dotnet build pablo/pablo.slnx --no-restore

      - name: Check format
        run: dotnet format pablo/pablo.slnx --verify-no-changes
