services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pablo
      POSTGRES_PASSWORD: pablo
      POSTGRES_DB: pablo
    volumes:
      # PG 18+ stores data under /var/lib/postgresql/$PG_MAJOR/docker; mount the parent.
      - pablo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pablo -d pablo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pablo_pgdata:
