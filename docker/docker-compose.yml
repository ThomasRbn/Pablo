services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pablo
      POSTGRES_PASSWORD: pablo
      POSTGRES_DB: pablo
    volumes:
      - pablo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pablo -d pablo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pablo_pgdata:
